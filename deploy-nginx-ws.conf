# WebShopp (J&D) — 生产反代配置（新增 /ws 实时客服 WebSocket 反代）
# 域名到位后：把 server_name 换成域名，再启用 HTTPS 段并签发证书
server {
    listen 80 default_server;
    server_name _ 8.217.66.83 localhost;

    # 预留 Let's Encrypt 验证目录（域名到位后直接可用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 后台上传 10MB 商品图
    client_max_body_size 20M;

    # ⭐ 实时客服 IM：WebSocket 反代到本机 WS 服务 :4000
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：消息可能长时间无帧，超时必须放宽
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering off;
    }

    # 图片/静态资源缓存
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 后台与接口不缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
